<title>Olympus Mons Site Navigator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: ban do lon ben trai, bang dieu khien hep ben phai; mat cat do cao chay ngang ben duoi. Mot cot tren dien thoai. */
:root {
  --bg: #f4f5f6; --panel: #ffffff; --ink: #14181c; --ink-2: #4c5560; --ink-3: #7b858f;
  --rule: #dfe3e7; --chip: #eceff2; --accent: #2a78d6; --short: #d9581f; --mark: #14181c;
  --halo: #ffffff; --warn-bg: #fff4e5; --warn-ink: #8a4b00;
  --f-display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111417; --panel: #1a1e22; --ink: #eef1f4; --ink-2: #b4bcc5; --ink-3: #87919b;
  --rule: #2c3238; --chip: #252a30; --accent: #4b93ea; --short: #f07a43; --mark: #eef1f4;
  --halo: #111417; --warn-bg: #3a2a12; --warn-ink: #f5c27a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111417; --panel: #1a1e22; --ink: #eef1f4; --ink-2: #b4bcc5; --ink-3: #87919b;
  --rule: #2c3238; --chip: #252a30; --accent: #4b93ea; --short: #f07a43; --mark: #eef1f4;
  --halo: #111417; --warn-bg: #3a2a12; --warn-ink: #f5c27a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3vw, 30px); letter-spacing: .01em; margin: 0; text-wrap: balance }
.sub { color: var(--ink-2); max-width: 70ch; margin: 2px 0 0 }
.prov { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3) }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr) } }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; min-width: 0 }

<title>Olympus Mons Site Navigator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: ban do lon ben trai, bang dieu khien hep ben phai; mat cat do cao chay ngang ben duoi. Mot cot tren dien thoai. */
:root {
  --bg: #f4f5f6; --panel: #ffffff; --ink: #14181c; --ink-2: #4c5560; --ink-3: #7b858f;
  --rule: #dfe3e7; --chip: #eceff2; --accent: #2a78d6; --short: #d9581f; --mark: #14181c;
  --halo: #ffffff; --warn-bg: #fff4e5; --warn-ink: #8a4b00;
  --f-display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111417; --panel: #1a1e22; --ink: #eef1f4; --ink-2: #b4bcc5; --ink-3: #87919b;
  --rule: #2c3238; --chip: #252a30; --accent: #4b93ea; --short: #f07a43; --mark: #eef1f4;
  --halo: #111417; --warn-bg: #3a2a12; --warn-ink: #f5c27a; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111417; --panel: #1a1e22; --ink: #eef1f4; --ink-2: #b4bcc5; --ink-3: #87919b;
  --rule: #2c3238; --chip: #252a30; --accent: #4b93ea; --short: #f07a43; --mark: #eef1f4;
  --halo: #111417; --warn-bg: #3a2a12; --warn-ink: #f5c27a; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px }
.wrap { max-width: 1280px; margin: 0 auto; display: grid; gap: 16px }
header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 6px 24px }
h1 { font-family: var(--f-display); font-weight: 700; font-size: clamp(22px, 3vw, 30px); letter-spacing: .01em; margin: 0; text-wrap: balance }
.sub { color: var(--ink-2); max-width: 70ch; margin: 2px 0 0 }
.prov { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3) }
.main { display: grid; grid-template-columns: minmax(0, 1fr) 330px; gap: 16px; align-items: start }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr) } }
.card { background: var(--panel); border: 1px solid var(--rule); border-radius: 8px; padding: 14px; min-width: 0 }
.maphead { display: flex; flex-wrap: wrap; gap: 8px 12px; justify-content: space-between; align-items: center; margin-bottom: 10px }
.seg { display: inline-flex; background: var(--chip); border-radius: 6px; padding: 2px; gap: 2px; flex-wrap: wrap }
.seg button { font: 500 12.5px var(--f-body); color: var(--ink-2); background: transparent; border: 0; border-radius: 4px; padding: 5px 10px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--panel); color: var(--ink); box-shadow: 0 0 0 1px var(--rule) }
.seg button:focus-visible, .sites button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.mapbox { position: relative; width: 100%; aspect-ratio: var(--ar, 1.2); max-width: 100%; border-radius: 4px; overflow: hidden; background: var(--chip); cursor: crosshair; touch-action: manipulation }
.mapbox canvas { position: absolute; inset: 0; width: 100%; height: 100% }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; margin-top: 10px; font-size: 12px; color: var(--ink-2) }
.ramp { display: grid; gap: 3px; min-width: 200px; flex: 1 1 220px; max-width: 340px }
.ramp .bar { height: 9px; border-radius: 2px }
.ramp .ticks { display: flex; justify-content: space-between; font-family: var(--f-mono); font-size: 11px; color: var(--ink-3) }
.key { display: inline-flex; align-items: center; gap: 6px }
.swatch-line { width: 22px; height: 0; border-top: 2.5px solid var(--accent) }
.swatch-line.short { border-top: 2px dashed var(--short) }
.swatch-hatch { width: 14px; height: 14px; border: 1px solid var(--ink-2); background: repeating-linear-gradient(45deg, var(--ink-2) 0 1.5px, transparent 1.5px 5px) }
.readout { font-family: var(--f-mono); font-size: 12px; color: var(--ink-2); margin-top: 8px; min-height: 18px; font-variant-numeric: tabular-nums; overflow-wrap: anywhere }
.side { display: grid; gap: 16px }
h2 { font-family: var(--f-display); font-weight: 600; font-size: 15px; letter-spacing: .04em; text-transform: uppercase; margin: 0 0 10px; color: var(--ink) }
.ctl { display: grid; gap: 12px }
.ctl label { display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; font-size: 13px; color: var(--ink-2) }
.ctl label output { font-family: var(--f-mono); color: var(--ink); font-variant-numeric: tabular-nums }
.ctl input[type=range] { grid-column: 1 / -1; width: 100%; accent-color: var(--accent) }
.hint { font-size: 12px; color: var(--ink-3); margin: 2px 0 0 }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 13px }
th, td { text-align: right; padding: 5px 0; border-bottom: 1px solid var(--rule) }
th:first-child, td:first-child { text-align: left; color: var(--ink-2); font-weight: 400 }
thead th { font-size: 12px; font-weight: 600 }
thead th.o { color: var(--accent) } thead th.s { color: var(--short) }
td.o { font-weight: 600 }
.msg { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 8px 10px; font-size: 12.5px; margin-top: 10px }
.sites { display: grid; gap: 6px; padding: 0; margin: 0; list-style: none }
.sites button { width: 100%; display: grid; grid-template-columns: 28px 1fr auto; gap: 8px; align-items: center; text-align: left;
  background: transparent; border: 1px solid var(--rule); border-radius: 6px; padding: 7px 9px; cursor: pointer; color: var(--ink); font: 13px var(--f-body) }
.sites button:hover { border-color: var(--accent) }
.sites button[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent) }
.sites .n { font-family: var(--f-display); font-weight: 700; font-size: 15px }
.sites .c { font-family: var(--f-mono); font-size: 11.5px; color: var(--ink-3) }
.sites .sc { font-family: var(--f-mono); font-size: 12.5px }
.prof { position: relative }
.prof svg { display: block; width: 100%; height: 240px; overflow: visible }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--rule); border-radius: 6px; padding: 6px 8px;
  font-size: 12px; font-variant-numeric: tabular-nums; box-shadow: 0 2px 8px rgba(0,0,0,.12); white-space: nowrap }
.tip b { font-weight: 600 }
.notes { color: var(--ink-2); font-size: 12.5px; display: grid; gap: 6px; max-width: 95ch }
.notes p { margin: 0 }
@media (prefers-reduced-motion: reduce) { * { transition: none !important } }
</style>
